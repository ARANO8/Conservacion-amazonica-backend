# Stack de la aplicacion en el VPS.
#
# Se copia al VPS como /opt/amzdesk/docker-compose.yml y lee sus valores de
# /opt/amzdesk/.env (permisos 600, fuera de git).
#
# Las imagenes no se construyen aqui: las publica GitHub Actions en GHCR y el
# VPS solo hace pull de la etiqueta inmutable sha-<commit>.
#
# NINGUN servicio publica puertos. El unico que escucha en el host es el nginx
# del stack `edge`, que alcanza a estos contenedores por la red compartida del
# mismo nombre. PostgreSQL ni siquiera esta en esa red: solo es visible desde
# la red interna.

name: amzdesk

services:
  db:
    image: postgres:15-alpine
    container_name: amzdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - interna

  backend:
    image: ${BACKEND_IMAGE}
    container_name: amzdesk_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      FRONTEND_URL: ${FRONTEND_URL}
      # El dominio aloja varios sistemas: la cookie se acota a este prefijo
      # para que el JWT no viaje a las aplicaciones vecinas.
      COOKIE_PATH: ${COOKIE_PATH:-/amzdesk}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    # Docker asigna 64 MB a /dev/shm y Chromium se cae con eso. Pesa aqui mas
    # de lo normal porque se lanza un navegador nuevo por cada PDF generado.
    # 512 MB y no mas: el VPS tiene 2 GB de RAM en total.
    shm_size: 512m
    networks:
      - interna
      - edge

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: amzdesk_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    networks:
      - edge

volumes:
  db_data:

networks:
  interna:
    driver: bridge
  # La crea el stack `edge`. Aqui solo se referencia.
  edge:
    external: true
    name: edge
