# Reparto del dominio entre el portfolio y los sistemas alojados.
#
# El HTTPS lo termina un proxy anterior al VPS, por eso aqui solo hay HTTP.

# Respeta el esquema original si el proxy anterior lo informa; si no viene,
# cae en el esquema de esta conexion. Sin esto la aplicacion creeria que todo
# el trafico es HTTP.
map $http_x_forwarded_proto $esquema_original {
    default   $scheme;
    "~^https$" https;
    "~^http$"  http;
}

server {
    listen 80;
    server_name _;

    # Resolvedor interno de Docker. Es imprescindible: nginx resuelve los
    # nombres una sola vez al arrancar, y cada despliegue RECREA los
    # contenedores con otra IP. Sin esto el proxy serviria 502 despues del
    # primer deploy hasta que alguien lo reiniciara a mano.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirecciones relativas. Por defecto nginx las reconstruye como
    # $scheme://$host/..., y como el TLS lo termina el proxy anterior, $scheme
    # aqui siempre es http: un usuario que llega por HTTPS acabaria redirigido
    # a HTTP. Con esto la cabecera Location sale como "/amzdesk/" y el navegador
    # conserva el esquema original.
    absolute_redirect off;

    client_max_body_size 10m;

    # A la salida estandar, no a un archivo: en un contenedor los logs se
    # consultan con `docker compose logs`, y un archivo interno quedaria
    # invisible desde fuera y creceria sin rotacion.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # ------------------------------------------------------------------------
    # AMZdesk — documentacion de la API.
    #
    # Swagger se monta incondicionalmente, sin mirar NODE_ENV, asi que sin esta
    # restriccion quedaria abierto a internet. Nginx elige el prefijo mas largo,
    # por lo que este bloque gana sobre los de abajo este donde este.
    # ------------------------------------------------------------------------
    location /amzdesk/api/doc {
        allow 127.0.0.1;
        # Agrega aqui tu IP publica para poder consultar la documentacion:
        # allow 200.100.50.25;
        deny all;

        set $amzdesk_api http://amzdesk_backend:3000;
        rewrite ^/amzdesk/api/(.*)$ /$1 break;
        proxy_pass $amzdesk_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
    }

    # ------------------------------------------------------------------------
    # AMZdesk — API.
    #
    # Nest sirve en la raiz (no define setGlobalPrefix), asi que hay que
    # recortar /amzdesk/api antes de reenviar. Se hace con `rewrite` y no con la
    # barra final de proxy_pass porque, al usar una variable como destino,
    # nginx desactiva la sustitucion automatica de la URI.
    # ------------------------------------------------------------------------
    location /amzdesk/api/ {
        set $amzdesk_api http://amzdesk_backend:3000;
        rewrite ^/amzdesk/api/(.*)$ /$1 break;
        proxy_pass $amzdesk_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;

        # Generar un PDF con Puppeteer puede superar el minuto por defecto.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------------
    # AMZdesk — frontend.
    #
    # Aqui la ruta se reenvia COMPLETA, con su prefijo: Next se compilo con
    # basePath=/amzdesk y espera recibirlo.
    #
    # El prefijo va SIN barra final y sin redireccion propia, a proposito. Next
    # considera canonica la forma sin barra (trailingSlash: false) y responde
    # 308 a /amzdesk/ para quitarsela. Si nginx redirigiera /amzdesk a
    # /amzdesk/, cada uno desharia lo del otro y el navegador entraria en un
    # bucle: ERR_TOO_MANY_REDIRECTS. Que normalice Next, que es quien manda.
    # ------------------------------------------------------------------------
    location /amzdesk {
        set $amzdesk_front http://amzdesk_frontend:3001;
        proxy_pass $amzdesk_front;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
        proxy_cache_bypass $http_upgrade;
    }

    # ------------------------------------------------------------------------
    # exbmail — envio de campanas de correo.
    #
    # Un solo bloque: aqui la API y las paginas son la misma aplicacion Next, y
    # sus rutas /api ya viven bajo el mismo prefijo. No hay nada que recortar,
    # la ruta se reenvia COMPLETA porque Next se compilo con basePath=/exbmail.
    #
    # Sin barra final y sin redireccion propia, por lo mismo que en /amzdesk:
    # que normalice Next o los dos entran en un bucle de redirecciones.
    # ------------------------------------------------------------------------
    location /exbmail {
        set $exbmail http://exbmail_app:3000;
        proxy_pass $exbmail;

        # Mas que los 10m globales: una campana viaja con su CSV y con los
        # adjuntos dentro de la misma peticion. Con el limite global, nginx
        # cortaria con un 413 antes de que la aplicacion pudiera decir nada.
        #
        # OJO: estos 25m NO son el tope real. El proxy del proveedor que hay
        # DELANTE de este nginx corta en 1 MB exacto (su client_max_body_size
        # por defecto, medido el 18/08/2026: 1048576 pasa, 1048577 da 413), y
        # ese 413 ni siquiera aparece en este access_log porque la peticion no
        # llega hasta aqui. Subir este numero no sirve de nada mientras el de
        # delante siga en 1 MB.
        client_max_body_size 25m;

        # Subir una lista de miles de filas y sus adjuntos puede pasar del
        # minuto por defecto en una conexion lenta.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # `$http_host` y no `$host`: el primero conserva el puerto. Next valida
        # las Server Actions comparando la cabecera Origin del navegador con el
        # host reenviado, y `$host` se come el puerto. En cuanto el dominio no
        # esta en el puerto estandar, TODAS las acciones de servidor mueren con
        # «Invalid Server Actions request» y el formulario no envia nada.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_original;
        proxy_cache_bypass $http_upgrade;
    }

    # ------------------------------------------------------------------------
    # Raiz del dominio: reservada para el portfolio. Por ahora, un marcador.
    #
    # Los sistemas que se agreguen despues (por ejemplo /ssda) se suman como
    # bloques `location` nuevos, calcados de los de arriba.
    # ------------------------------------------------------------------------
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
