# Nginx del host para el VPS de pruebas.
#
# Instalacion:
#   sudo cp amzdesk.conf /etc/nginx/sites-available/amzdesk.conf
#   sudo sed -i 's/SUBDOMINIO/tu-subdominio.tudominio.com/g' /etc/nginx/sites-available/amzdesk.conf
#   sudo ln -s /etc/nginx/sites-available/amzdesk.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado debe existir ANTES de habilitar este archivo, o nginx -t falla:
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d tu-subdominio.tudominio.com

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMINIO;

    # Renovacion automatica de Let's Encrypt (desafio HTTP-01).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SUBDOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SUBDOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SUBDOMINIO/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    access_log /var/log/nginx/amzdesk.access.log;
    error_log  /var/log/nginx/amzdesk.error.log;

    # ------------------------------------------------------------------------
    # Swagger. Se monta incondicionalmente en main.ts, sin mirar NODE_ENV, asi
    # que sin esta restriccion quedaria abierto a internet. Nginx elige el
    # prefijo mas largo, por lo que este bloque gana sobre /api/ este donde este.
    # ------------------------------------------------------------------------
    location /api/doc {
        allow 127.0.0.1;
        # Agrega aqui tu IP publica para poder consultar la documentacion:
        # allow 200.100.50.25;
        deny all;

        proxy_pass http://127.0.0.1:3000/doc;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # API. La barra final de proxy_pass es lo que descarta el prefijo: una
    # peticion a /api/auth/login llega a Nest como /auth/login. El backend no
    # define setGlobalPrefix, asi que sin esa barra ninguna ruta resolveria.
    # ------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar un PDF con Puppeteer puede superar el minuto por defecto.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ------------------------------------------------------------------------
    # Frontend (Next.js). Todo lo demas, incluidos /_next/* y los assets.
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
