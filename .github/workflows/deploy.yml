name: Deploy

# Solo `main` despliega. `develop` es la rama de desarrollo y no publica nada:
# llegar al VPS es un acto deliberado, fusionar develop en main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos despliegues simultaneos dejarian el VPS en un estado indeterminado.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los tipos del cliente de Prisma hacen falta para compilar y para los tests.
      - run: npx prisma generate --generator client

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  build-push:
    name: Construir y publicar imagen
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR solo acepta nombres en minuscula y el repo tiene mayusculas.
      - id: vars
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.vars.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar el servicio backend y comprobarlo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/amzdesk
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ needs.build-push.outputs.image }}|" .env
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f

            # El smoke test corre AQUI DENTRO y no desde el runner a proposito:
            # el proxy que esta delante del VPS responde 403 a las peticiones
            # que llegan desde GitHub Actions, asi que una comprobacion externa
            # fallaria siempre sin decir nada sobre el estado real del servicio.
            #
            # La peticion sale por el puerto 80 del host, o sea que atraviesa el
            # proxy `edge`: comprueba el mismo camino que usa un navegador, no
            # solo que el contenedor este vivo.
            #
            # Se reintenta hasta 2 minutos porque el entrypoint aplica las
            # migraciones antes de levantar la API.
            echo "Esperando a que la API responda..."
            for intento in $(seq 1 24); do
              CODIGO=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1/amzdesk/api/health || true)
              if [ "$CODIGO" = "200" ]; then
                echo "La API responde 200 en /amzdesk/api/health"
                exit 0
              fi
              echo "Intento $intento: HTTP ${CODIGO:-sin respuesta}"
              sleep 5
            done

            echo "La API no llego a responder 200. Ultimos registros:"
            docker compose logs --tail 50 backend
            exit 1
