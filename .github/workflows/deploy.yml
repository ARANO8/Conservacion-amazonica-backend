name: Deploy

# Solo `main` despliega. `develop` es la rama de desarrollo y no publica nada:
# llegar al VPS es un acto deliberado, fusionar develop en main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos despliegues simultaneos dejarian el VPS en un estado indeterminado.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los tipos del cliente de Prisma hacen falta para compilar y para los tests.
      - run: npx prisma generate --generator client

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  build-push:
    name: Construir y publicar imagen
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR solo acepta nombres en minuscula y el repo tiene mayusculas.
      - id: vars
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.repo }}:sha-${{ github.sha }}
            ${{ steps.vars.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el VPS
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar el servicio backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/amzdesk
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ needs.build-push.outputs.image }}|" .env
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f

      # Las migraciones corren en el entrypoint del contenedor, asi que el
      # arranque puede tardar. Se reintenta hasta un minuto antes de fallar.
      - name: Smoke test
        run: |
          for intento in $(seq 1 12); do
            if curl -fsS "${{ secrets.APP_URL }}/amzdesk/api/health" > /dev/null; then
              echo "La API responde correctamente en /amzdesk/api/health"
              exit 0
            fi
            echo "Intento $intento: la API aun no responde, reintentando en 5s..."
            sleep 5
          done
          echo "::error::La API no respondio a /amzdesk/api/health tras 60 segundos"
          exit 1
